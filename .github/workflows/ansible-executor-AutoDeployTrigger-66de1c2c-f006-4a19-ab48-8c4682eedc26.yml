name: Trigger auto deployment for ansible-executor

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/ansible-executor-AutoDeployTrigger-*.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 构建推送镜像（用你配置好的 ACR 管理员账号密码 Secrets）
      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: gtsdrtaiansible.azurecr.io # 确认拼写
          username: ${{ secrets.ANSIBLEEXECUTOR_REGISTRY_USERNAME }}
          password: ${{ secrets.ANSIBLEEXECUTOR_REGISTRY_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t gtsdrtaiansible.azurecr.io/ansible-executor:${{ github.sha }} .
          docker push gtsdrtaiansible.azurecr.io/ansible-executor:${{ github.sha }}

      # Azure 登录，仅用于更新 Container App 的镜像版本
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ANSIBLEEXECUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ANSIBLEEXECUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ANSIBLEEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App
        run: |
          az containerapp update \
            --name ansible-executor \
            --resource-group ai-api \
            --image gtsdrtaiansible.azurecr.io/ansible-executor:${{ github.sha }}
