name: Trigger auto deployment for ansible-executor

on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '.github/workflows/ansible-executor-AutoDeployTrigger-*.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ANSIBLEEXECUTOR_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ANSIBLEEXECUTOR_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ANSIBLEEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure Login
        run: |
          az account show
          az account set --subscription ${{ secrets.ANSIBLEEXECUTOR_AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        uses: azure/docker-login@v2
        with:
          login-server: gtsdrtaiansible.azurecr.io
          username: ${{ secrets.ANSIBLEEXECUTOR_REGISTRY_USERNAME }}
          password: ${{ secrets.ANSIBLEEXECUTOR_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t gtsdrtaiansible.azurecr.io/ansible-executor:${{ github.sha }} .
          docker push gtsdrtaiansible.azurecr.io/ansible-executor:${{ github.sha }}

      - name: Deploy to Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: gtsdrtaiansible.azurecr.io/ansible-executor:${{ github.sha }}
          containerAppName: ansible-executor
          resourceGroup: ai-api   # 注意：根据日志，实际资源组是 ai-api，请确认
          # 如果 Container App 已存在，不需要再指定 containerAppEnvironment
          # 如果需要创建，再提供 containerAppEnvironment 等参数
