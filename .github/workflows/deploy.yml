name: Deploy existing image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要部署的镜像 tag（ACR 中已存在的，如 v7）"
        required: true
        default: "v7"

permissions:
  id-token: write
  contents: read

env:
  ACR: gtsdrtansible
  IMAGE: ansible-executor
  CONTAINERAPP: ansible-executor
  RG: ansible

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check image exists in ACR
        run: |
          az acr repository show-tags --name $ACR --repository $IMAGE \
            --query "contains(@, '${{ inputs.tag }}')" -o tsv | grep -q true \
            || { echo "镜像 $IMAGE:${{ inputs.tag }} 在 ACR 中不存在"; exit 1; }

      - name: Update Container App
        run: |
          az containerapp update \
            -n $CONTAINERAPP -g $RG \
            --image $ACR.azurecr.io/$IMAGE:${{ inputs.tag }}

      - name: Smoke test - list tasks
        run: |
          sleep 60
          FQDN=$(az containerapp show -n $CONTAINERAPP -g $RG \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -sf -H "X-API-Key: ${{ secrets.CONTAINER_API_KEY }}" https://$FQDN/tasks
