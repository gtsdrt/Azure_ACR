---
- name: Delete Azure Resource Group
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - azure.azcollection
  vars:
    ansible_python_interpreter: /usr/local/bin/python3.11

    # 默认资源组名，可通过 extra-vars 覆盖
    resource_group: "{{ resource_group_name | default('az_ansible') }}"

  tasks:
    - name: Check AZURE_SUBSCRIPTION_ID env var
      ansible.builtin.fail:
        msg: "Environment variable AZURE_SUBSCRIPTION_ID is not set in Container App"
      when: lookup('env', 'AZURE_SUBSCRIPTION_ID') | length == 0

    - name: Delete resource group
      azure.azcollection.azure_rm_resourcegroup:
        auth_source: msi
        subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
        name: "{{ resource_group }}"
        state: absent
        force_delete_nonempty: true   # 可选，强制删除包含资源的资源组（需要 Azure SDK 版本支持）
      register: delete_result

    - name: Output result
      ansible.builtin.debug:
        msg:
          resource_group: "{{ resource_group }}"
          deleted: true