---
- name: Associate multiple subnets to a Network Security Group
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - azure.azcollection
  vars:
    ansible_python_interpreter: /usr/local/bin/python3.11

    resource_group: "{{ resource_group_name | default('az_ansible') }}"
    vnet_name: "{{ vnet_name | default('az_ansible_vnet1') }}"
    nsg_name: "{{ nsg_name | default('') }}"               # 目标 NSG 名称
    subnet_names: "{{ subnet_names | default('') }}"        # 逗号分隔的子网名称，例如 "subnet1,subnet2,subnet3"

  tasks:
    - name: Check AZURE_SUBSCRIPTION_ID env var
      ansible.builtin.fail:
        msg: "Environment variable AZURE_SUBSCRIPTION_ID is not set in Container App"
      when: lookup('env', 'AZURE_SUBSCRIPTION_ID') | length == 0

    - name: Associate subnets to NSG
      azure.azcollection.azure_rm_subnet:
        auth_source: msi
        subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
        resource_group: "{{ resource_group }}"
        name: "{{ item }}"
        virtual_network: "{{ vnet_name }}"
        security_group: "{{ nsg_name }}"
      loop: "{{ subnet_names.split(',') | map('trim') | select('!=','') | list }}"
      when: nsg_name | length > 0 and subnet_names | length > 0

    - name: Output summary
      ansible.builtin.debug:
        msg:
          nsg_name: "{{ nsg_name }}"
          associated_subnets: "{{ subnet_names.split(',') | map('trim') | select('!=','') | list }}"