---
- name: Create multiple Network Security Groups
  hosts: localhost
  connection: local
  gather_facts: false
  collections:
    - azure.azcollection
  vars:
    ansible_python_interpreter: /usr/local/bin/python3.11

    # 内部变量映射外部参数，避免自引用递归
    resource_group: "{{ resource_group_name | default('az_ansible') }}"
    nsg_names: "{{ nsg_names | default('') }}"          # 逗号分隔字符串，例如 "nsg1,nsg2,nsg3"
    location: "{{ location | default('norwayeast') }}"

  tasks:
    - name: Check AZURE_SUBSCRIPTION_ID env var
      ansible.builtin.fail:
        msg: "Environment variable AZURE_SUBSCRIPTION_ID is not set in Container App"
      when: lookup('env', 'AZURE_SUBSCRIPTION_ID') | length == 0

    - name: Create NSGs
      azure.azcollection.azure_rm_securitygroup:
        auth_source: msi
        subscription_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
        resource_group: "{{ resource_group }}"
        name: "{{ item }}"
        location: "{{ location }}"
        state: present
      loop: "{{ nsg_names.split(',') | map('trim') | select('!=','') | list }}"
      when: nsg_names | length > 0

    - name: Output summary
      ansible.builtin.debug:
        msg:
          resource_group: "{{ resource_group }}"
          created_nsgs: "{{ nsg_names.split(',') | map('trim') | select('!=','') | list }}"